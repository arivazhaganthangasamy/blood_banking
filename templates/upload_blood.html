{% extends "base.html" %}
{% block title %}Upload Blood - LifeStream{% endblock %}

{% block content %}
<div style="min-height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;padding:2rem;">
  <div style="width:100%;max-width:560px;">
    <div style="text-align:center;margin-bottom:2rem;">
      <div style="font-size:3rem;margin-bottom:1rem;">🏥</div>
      <h1 style="font-family:'Playfair Display',serif;font-size:2rem;">Upload Blood Availability</h1>
      <p style="color:rgba(255,255,255,0.5);">Update your blood inventory for {{ session.username }}</p>
    </div>
    <div class="card">
      <form method="POST" action="{{ url_for('upload_blood') }}">
        <div class="form-group">
          <label>Blood Type Available</label>
          <select name="blood_type" required>
            <option value="">Select blood type</option>
            {% for bt in ['A+','A-','B+','B-','O+','O-','AB+','AB-'] %}
            <option value="{{ bt }}">{{ bt }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Units Available</label>
          <input type="number" name="units" placeholder="e.g. 10" min="1" required>
        </div>
        <div class="form-group">
          <label>Hospital Location (Area, Chennai)</label>
          <input type="text" name="location" placeholder="e.g. Adyar, Chennai" required>
        </div>
        <div class="form-group">
          <label>Contact Number</label>
          <input type="tel" name="contact" placeholder="044-XXXXXXXX" required>
        </div>
        <div style="display:flex;gap:1rem;margin-top:1.5rem;">
          <a href="{{ url_for('hospital_dashboard') }}" class="btn btn-outline" style="flex:1;justify-content:center;">Cancel</a>
          <button type="submit" class="btn btn-primary" style="flex:2;justify-content:center;">
            <i class="fas fa-upload"></i> Upload Blood Data
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
